<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hye-won Tak | Photography Archive</title>
    <!-- Fonts: Cormorant Garamond (Serif), Inter (Sans-serif), JetBrains Mono (Monospace), Caveat (Handwriting) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=Caveat:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            /* Default Theme: Light */
            --bg-color: #fafafa;
            --text-primary: #111111;
            --text-secondary: #666666;
            --text-muted: #b0b0b0;
            --border-color: #e5e5e5;
            --card-bg: #ffffff;
            --accent-color: #B5B17B;

            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-mono: 'JetBrains Mono', monospace;

            --transition-speed: 0.5s;
            --transition-ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            color: var(--text-primary);
            background-color: var(--bg-color);
            line-height: 1.6;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: background-color var(--transition-speed) var(--transition-ease), color var(--transition-speed) var(--transition-ease);
            -webkit-font-smoothing: antialiased;
        }

        /* Horizontal Scroll Gallery Container */
        .scroll-container {
            width: 100%;
            height: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 0;
            position: relative;
            cursor: grab;
            user-select: none;
            -webkit-overflow-scrolling: touch;
        }

        .scroll-container::-webkit-scrollbar {
            display: none;
        }

        .scroll-container.active {
            cursor: grabbing;
        }

        /* Parallel Horizontal Tracks */
        .top-track,
        .bottom-track {
            display: flex;
            gap: 60px;
            width: max-content;
            height: 38vh;
        }

        .top-track {
            align-items: flex-start;
            padding-left: 10vw;
            padding-right: 15vw;
            animation: slideLeftTop 2.0s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .bottom-track {
            align-items: flex-end;
            padding-left: 25vw;
            /* Stagger start offset */
            padding-right: 10vw;
            animation: slideLeftBottom 2.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideLeftTop {
            0% {
                transform: translateX(450px);
                opacity: 0;
            }

            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideLeftBottom {
            0% {
                transform: translateX(600px);
                opacity: 0;
            }

            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Centered Middle Navigation Banner */
        .middle-nav {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 48px;
            z-index: 10;
            pointer-events: auto;
        }

        .middle-nav a {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            letter-spacing: 2px;
            color: var(--text-secondary);
            text-decoration: none;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .middle-nav a:hover {
            color: var(--accent-color);
        }

        .middle-nav .title {
            font-family: 'Caveat', cursive;
            font-size: 2.8rem;
            color: var(--text-primary);
            font-weight: 400;
            letter-spacing: 1px;
            white-space: nowrap;
            user-select: none;
        }

        /* Gallery Item (Image Card) */
        .gallery-item {
            display: flex;
            flex-direction: column;
            height: 100%;
            flex-shrink: 0;
            cursor: pointer;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--border-color);
            transition: background-color var(--transition-speed) var(--transition-ease);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(15%) contrast(95%);
            transition: transform 1.2s var(--transition-ease), filter 0.8s var(--transition-ease);
        }

        .gallery-item:hover img {
            transform: scale(1.05);
            filter: grayscale(0%) contrast(100%);
        }

        /* Lightbox Modal */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(250, 250, 250, 0.98);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s var(--transition-ease);
            backdrop-filter: blur(10px);
        }

        .lightbox.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-content {
            position: relative;
            width: 90%;
            max-width: 1000px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lightbox-image-container {
            width: 100%;
            height: 72vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transform: scale(0.97);
            transition: opacity 0.4s var(--transition-ease), transform 0.4s var(--transition-ease);
        }

        .lightbox.active img.loaded {
            opacity: 1;
            transform: scale(1);
        }

        /* Lightbox Controls */
        .lightbox-close {
            position: fixed;
            top: 30px;
            right: 40px;
            background: none;
            border: none;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            cursor: pointer;
            letter-spacing: 1px;
            padding: 8px;
            z-index: 2100;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .lightbox-close:hover {
            opacity: 1;
            color: var(--accent-color);
        }

        .lightbox-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 2rem;
            font-weight: 200;
            cursor: pointer;
            padding: 20px;
            z-index: 2100;
            opacity: 0.5;
            transition: opacity 0.3s, color 0.3s;
            user-select: none;
        }

        .lightbox-nav:hover {
            opacity: 1;
            color: var(--accent-color);
        }

        .lightbox-prev {
            left: 20px;
        }

        .lightbox-next {
            right: 20px;
        }

        /* Responsive Layout */
        @media (max-width: 768px) {
            .scroll-container {
                padding: 0;
            }

            .top-track,
            .bottom-track {
                height: 32vh;
                gap: 30px;
            }

            .top-track {
                padding-left: 5vw;
                padding-right: 10vw;
            }

            .bottom-track {
                padding-left: 20vw;
                padding-right: 5vw;
            }

            .middle-nav {
                gap: 20px;
            }

            .middle-nav .title {
                font-size: 1.8rem;
            }

            .middle-nav a {
                font-size: 0.62rem;
                letter-spacing: 1px;
            }

            .lightbox-nav {
                display: none;
                /* Hide nav arrows on mobile */
            }

            .lightbox-close {
                top: 20px;
                right: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Overlay Navigation elements fixed in the center of the viewport -->

        <a href="../index.html">Artists</a>
        <span class="title">FOR YOUR CONSIDERATION</span>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightbox-close">CLOSE</button>
        <button class="lightbox-nav lightbox-prev" id="lightbox-prev">←</button>
        <button class="lightbox-nav lightbox-next" id="lightbox-next">→</button>
        <div class="lightbox-content">
            <div class="lightbox-image-container">
                <img id="lightbox-img" src="" alt="Enlarged Photo">
            </div>
        </div>
    </div>

        <script>
            // Horizontal Mouse Wheel Scroll helper
            const scrollContainer = document.getElementById('scroll-container');
            scrollContainer.addEventListener('wheel', (e) => {
                if (e.deltaY !== 0) {
                    e.preventDefault();
                    scrollContainer.scrollLeft += e.deltaY;
                }
            });

            // Mouse Drag to Scroll Logic
            let isDown = false;
            let startX;
            let scrollLeft;

            scrollContainer.addEventListener('mousedown', (e) => {
                // Check if clicking links or interactive elements to prevent blocking clicks
                if (e.target.closest('a') || e.target.closest('button')) return;
                isDown = true;
                scrollContainer.classList.add('active');
                startX = e.pageX - scrollContainer.offsetLeft;
                scrollLeft = scrollContainer.scrollLeft;
            });

            scrollContainer.addEventListener('mouseleave', () => {
                isDown = false;
                scrollContainer.classList.remove('active');
            });

            scrollContainer.addEventListener('mouseup', () => {
                isDown = false;
                scrollContainer.classList.remove('active');
            });

            scrollContainer.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - scrollContainer.offsetLeft;
                const walk = (x - startX) * 1.5; // Scroll speed multiplier
                scrollContainer.scrollLeft = scrollLeft - walk;
            });

            // Lightbox Logic
            const galleryItems = document.querySelectorAll('.gallery-item');
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const lightboxClose = document.getElementById('lightbox-close');
            const lightboxPrev = document.getElementById('lightbox-prev');
            const lightboxNext = document.getElementById('lightbox-next');

            let currentIndex = 0;
            const imagesData = [];

            // Extract image data from DOM
            galleryItems.forEach((item, index) => {
                const img = item.querySelector('img');
                imagesData.push({
                    src: img.getAttribute('src')
                });

                item.addEventListener('click', (e) => {
                    // Ensure drag does not trigger click
                    if (scrollContainer.classList.contains('active')) return;
                    openLightbox(index);
                });
            });

            function openLightbox(index) {
                currentIndex = index;
                const data = imagesData[currentIndex];

                lightboxImg.classList.remove('loaded');
                lightboxImg.src = data.src;

                lightbox.classList.add('active');
                document.body.style.overflow = 'hidden';

                // Fade image in after source is set
                lightboxImg.onload = () => {
                    lightboxImg.classList.add('loaded');
                };
            }

            function closeLightbox() {
                lightbox.classList.remove('active');
                lightboxImg.classList.remove('loaded');
                document.body.style.overflow = '';
            }

            function showNext() {
                currentIndex = (currentIndex + 1) % imagesData.length;
                openLightbox(currentIndex);
            }

            function showPrev() {
                currentIndex = (currentIndex - 1 + imagesData.length) % imagesData.length;
                openLightbox(currentIndex);
            }

            lightboxClose.addEventListener('click', closeLightbox);
            lightboxNext.addEventListener('click', showNext);
            lightboxPrev.addEventListener('click', showPrev);

            // Click outside image to close
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox || e.target === document.querySelector('.lightbox-image-container') || e.target === lightbox.querySelector('.lightbox-content')) {
                    closeLightbox();
                }
            });

            // Keyboard Navigation
            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('active')) return;
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowRight') showNext();
                if (e.key === 'ArrowLeft') showPrev();
            });
        </script>
    </body>
