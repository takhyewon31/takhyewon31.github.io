    </script>
    <style>
        /* Smooth Scrollbar Customization for Right Panel */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e4e4e7;
            border-radius: 2px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #d4d4d8;
        }

        /* Pixel Map Styles */
        .pixel-dot {
            transition: fill 0.3s ease, transform 0.3s ease;
        }

        .path-region-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* Absolute Map Markers (Hidden by default, shown on active/hover) */
        .map-marker {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .map-marker.active {
            opacity: 1;
            pointer-events: auto;
        }

        .path-region {
            fill: transparent;
            stroke: transparent;
            pointer-events: fill;
            /* captures hover anywhere inside the shape */
            cursor: pointer;
            transition: fill 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                stroke 0.3s ease;
        }

        .path-region.active {
            fill: rgba(0, 0, 0, 0.82);
            stroke: #000000;
            stroke-width: 0.6;
        }
    </style>
</head>

    <!-- Main Focus Photo Viewer (Header Direct Sub-Layout) -->
    <main class="flex-1 w-full bg-[#fafafa] flex flex-col justify-between items-center p-4 md:p-8 overflow-hidden relative select-none">
        <!-- Sub-header Details Bar -->
        <div class="w-full max-w-4xl flex justify-between items-center font-mono text-xs tracking-widest text-zinc-400 py-2">
            <span id="photo-counter" class="text-zinc-500 font-medium">01 / 06</span>
            <span id="photo-title" class="text-zinc-900 font-sans font-medium tracking-normal text-sm md:text-base">종로구, 세운상가</span>
            <span id="photo-info" class="text-zinc-400 text-[11px] uppercase">Seoul Archive</span>
        </div>

        <!-- Central Main Photo Display Wrapper -->
        <div class="relative w-full max-w-5xl flex-1 flex items-center justify-center my-auto px-4 group">
            <!-- Prev Arrow Button -->
            <button onclick="showPrevPhoto()" 
                class="absolute left-0 md:left-4 z-20 font-mono text-xl md:text-2xl text-zinc-300 hover:text-zinc-950 p-3 select-none transition-colors opacity-60 hover:opacity-100 focus:outline-none"
                aria-label="Previous Photo">
                ←
            </button>

            <!-- Photo Display -->
            <div class="relative max-h-[70vh] md:max-h-[76vh] flex items-center justify-center cursor-pointer transition-transform duration-300 active:scale-[0.99]" onclick="showNextPhoto()">

                    class="max-h-[70vh] md:max-h-[76vh] w-auto max-w-full object-contain mx-auto shadow-sm transition-opacity duration-300 opacity-100">
            </div>

            <!-- Next Arrow Button -->
            <button onclick="showNextPhoto()" 
                class="absolute right-0 md:right-4 z-20 font-mono text-xl md:text-2xl text-zinc-300 hover:text-zinc-950 p-3 select-none transition-colors opacity-60 hover:opacity-100 focus:outline-none"
                aria-label="Next Photo">
                →
            </button>
        </div>

        <!-- Bottom Navigation Controls & Indicator -->
        <div class="w-full max-w-4xl flex justify-between items-center font-mono text-[11px] tracking-widest text-zinc-400 pt-2 border-t border-zinc-200/60">
            <button onclick="showPrevPhoto()" class="hover:text-black transition-colors uppercase py-1 flex items-center gap-1">
                <span>← Prev</span>
            </button>
            <div class="flex items-center gap-2">
                <span class="text-zinc-400 text-[10px]">Click image or use Arrow keys to navigate</span>
            </div>
            <button onclick="showNextPhoto()" class="hover:text-black transition-colors uppercase py-1 flex items-center gap-1">
                <span>Next →</span>
            </button>
        </div>
    </main>

                    const text = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(text, 'text/html');
                    const links = doc.querySelectorAll('a');

                    links.forEach(link => {
                        const href = link.getAttribute('href');
                        if (href) {
                            const filename = href.split('/').pop();

        // Dynamic Pixel Map Generation using precise pre-computed static dots
        function generatePixelMap() {
            const svg = document.getElementById('korea-map');
            if (!svg) return;

            // Get the 151 municipality paths
            const paths = Array.from(svg.querySelectorAll('path.path-region'));

            // Create group for pixel dots
            const dotsGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            dotsGroup.setAttribute('id', 'pixel-dots');
            svg.appendChild(dotsGroup);

            const r = 1.3;   // dot radius

            // Map IDs to bilingual names
            const koreanNames = {
                'seoul': '서울 (Seoul)',
                'incheon': '인천 (Incheon)',
                'daegu': '대구 (Daegu)',
                'busan': '부산 (Busan)',
                'daejeon': '대전 (Daejeon)',
                'ulsan': '울산 (Ulsan)',
                'sejong': '세종 (Sejong)',
                'gwangju-metro': '광주 (Gwangju)',
                'sokcho': '속초 (Sokcho)',
                'yangyang': '양양 (Yangyang)',
                'inje': '인제 (Inje)',
                'gyeongju': '경주 (Gyeongju)',
                'jeju': '제주 (Jeju)',
                'ulleungdo': '울릉도 (Ulleungdo)',
                'dokdo': '독도 (Dokdo)'
            };

            // Render pre-computed static dots
            staticPixelDots.forEach(dot => {
                const x = dot[0];
                const y = dot[1];
                const regionId = regionKeys[dot[2]];

                // Map logical photo regions to visual dot regions
                let activeCountRegion = regionId;
                if (regionId === "incheon" || regionId === "gyeonggi") {
                    activeCountRegion = "seoul";
                } else if (regionId === "north-jeolla") {
                    activeCountRegion = "gunsan";
                }

                const count = photoCounts[activeCountRegion] || 0;


                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', x.toFixed(1));
                circle.setAttribute('cy', y.toFixed(1));
                circle.setAttribute('r', r);

                circle.setAttribute('fill', getRegionFillColor(count));
                circle.setAttribute('class', `pixel-dot dot-${regionId} dot-mapped-${activeCountRegion}`);
                circle.setAttribute('data-region', regionId);
                circle.setAttribute('data-active-region', activeCountRegion);

                // SVG Tooltip for administrative name scans on hover
                const titleEl = document.createElementNS('http://www.w3.org/2000/svg', 'title');
                const labelText = koreanNames[regionId] || (regionId.charAt(0).toUpperCase() + regionId.slice(1));
                titleEl.textContent = labelText;
                circle.appendChild(titleEl);

                // Click event to scroll to section
                circle.addEventListener('click', () => {
                    const regionToSectionMap = {
                        'seoul': 'seoul',
                        'gunsan': 'gunsan',
                        'sokcho': 'gangwon',
                        'yangyang': 'gangwon',
                        'inje': 'gangwon',
                        'gyeongju': 'gyeongju',
                        'jeju': 'jeju'
                    };
                    const sectionId = regionToSectionMap[activeCountRegion] || regionToSectionMap[regionId];
                    if (sectionId) scrollToSection(sectionId);
                });

                dotsGroup.appendChild(circle);
            });

            // Activate mouse events on base paths directly
            paths.forEach(path => {
                const regionId = path.id;
                let activeCountRegion = regionId;
                if (regionId === "incheon" || regionId === "gyeonggi") {
                    activeCountRegion = "seoul";
                } else if (regionId === "north-jeolla") {
                    activeCountRegion = "gunsan";
                }

                path.addEventListener('mouseenter', () => highlightRegion(activeCountRegion, true));
                path.addEventListener('mouseleave', () => highlightRegion(activeCountRegion, false));
                path.addEventListener('click', () => {
                    const regionToSectionMap = {
                        'seoul': 'seoul',
                        'gunsan': 'gunsan',
                        'sokcho': 'gangwon',
                        'yangyang': 'gangwon',
                        'inje': 'gangwon',
                        'gyeongju': 'gyeongju',
                        'jeju': 'jeju'
                    };
                    const sectionId = regionToSectionMap[activeCountRegion] || regionToSectionMap[regionId];
                    if (sectionId) scrollToSection(sectionId);
                });
            });
        }

        // Highlight whole region's pixel dots + corresponding absolute marker
        function highlightRegion(regionId, isHighlighted) {
            let targetClass = `.dot-${regionId}`;
            if (regionId === "seoul" || regionId === "incheon" || regionId === "gyeonggi") {
                targetClass = ".dot-mapped-seoul";
            } else if (regionId === "gunsan" || regionId === "north-jeolla") {
                targetClass = ".dot-mapped-gunsan";
            }

            const dots = document.querySelectorAll(targetClass);
            const count = photoCounts[regionId] || 0;

            dots.forEach(dot => {
                if (isHighlighted) {
                    dot.style.fill = 'hsl(56, 75%, 45%)'; // Highlight color: rich gold
                    dot.style.transform = 'scale(2)';
                    dot.style.transformOrigin = `${dot.getAttribute('cx')}px ${dot.getAttribute('cy')}px`;
                } else {
                    dot.style.fill = getRegionFillColor(count);
                    dot.style.transform = '';
                }
            });

            // Municipal SVG overlay highlight (precise boundary fill)
            const overlayPath = document.getElementById(regionId);
            if (overlayPath) {
                if (isHighlighted) {
                    overlayPath.classList.add('active');
                } else {
                    overlayPath.classList.remove('active');
                }
            }

            // Map path IDs to absolute markers
            const marker = markers[regionId];
            if (marker) {
                const label = marker.querySelector('.marker-label');
                const line = marker.querySelector('.marker-line');
                if (label && line) {
                    if (isHighlighted) {
                        marker.classList.add('active');
                        label.style.backgroundColor = '#B5B17B';
                        label.style.borderColor = '#B5B17B';
                        label.style.color = '#ffffff';
                        line.style.backgroundColor = '#B5B17B';
                    } else {
                        marker.classList.remove('active');
                        label.style.backgroundColor = '';
                        label.style.borderColor = '';
                        label.style.color = '';
                        line.style.backgroundColor = '';
                    }
                }
            }
        }

        // Seoul Real-time Clock
        function updateSeoulTime() {
            const clockElement = document.getElementById('seoul-clock');
            if (!clockElement) return;

            const options = {
                timeZone: 'Asia/Seoul',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };

            const formatter = new Intl.DateTimeFormat('en-US', options);
            const timeParts = formatter.formatToParts(new Date());

            const hour = timeParts.find(p => p.type === 'hour').value;
            const minute = timeParts.find(p => p.type === 'minute').value;
            const second = timeParts.find(p => p.type === 'second').value;

            clockElement.textContent = `SEOUL ${hour}:${minute}:${second}`;
        }
