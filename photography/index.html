<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hye-won Tak | Photography Archive</title>
    <meta name="description" content="탁혜원의 사진 아카이브. 일상의 기록과 시각적 탐색을 담아낸 사진 갤러리입니다.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'MapoGoldenPier';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/MapoGoldenPierA.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg-color: #ffffff;
            --text-primary: #111111;
            --text-secondary: #888888;
            --grid-border: #eeeeee;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --accent-color: #4a90e2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            color: var(--text-primary);
            line-height: 1.5;
            background-image: url('../pg/bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .gallery-container {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            width: 100%;
            max-width: 1200px;
            border-radius: 24px;
            padding: 60px 48px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--grid-border);
            padding-bottom: 20px;
            margin-bottom: 40px;
        }

        .header-left a {
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }

        .header-center a {
            font-size: 0.9rem;
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .header-center a:hover {
            color: var(--text-primary);
        }

        .header-right {
            display: flex;
            gap: 20px;
        }

        .header-right a {
            font-size: 0.9rem;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .header-right a:hover {
            color: var(--text-secondary);
        }

        /* Title Area */
        .title-section {
            text-align: center;
            margin-bottom: 50px;
        }

        .title-section h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -1.5px;
            line-height: 1.1;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .title-section .subtitle {
            font-family: 'MapoGoldenPier', serif;
            color: var(--text-secondary);
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* Masonry Gallery Grid */
        .gallery-grid {
            column-count: 3;
            column-gap: 24px;
            width: 100%;
        }

        .gallery-item {
            break-inside: avoid;
            margin-bottom: 24px;
            background-color: #ffffff; /* 액자의 마트지 느낌 */
            padding: 16px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 12px 25px rgba(0,0,0,0.08);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid #e2e2e2; /* 이미지 자체 경계 테두리 */
            transition: border-color 0.3s ease;
        }

        .gallery-item:hover img {
            border-color: #c0c0c0;
        }

        /* Footer */
        footer {
            margin-top: 60px;
            border-top: 1px solid var(--grid-border);
            padding-top: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Responsive Layout */
        @media (max-width: 1000px) {
            .gallery-grid {
                column-count: 2;
                column-gap: 20px;
            }

            .gallery-container {
                padding: 40px 30px;
            }

            .title-section h1 {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 600px) {
            .gallery-grid {
                column-count: 1;
            }

            .gallery-container {
                padding: 30px 20px;
            }

            header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .header-right {
                justify-content: center;
            }

            .title-section h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <header>
            <div class="header-left">
                <a href="../index.html">Tak Hye-won</a>
            </div>
            <div class="header-center">
                <a href="../index.html">PORTFOLIO</a>
            </div>
            <div class="header-right">
                <a href="mailto:takhyewon@gmail.com">Email</a>
                <a href="https://www.instagram.com/ximo_777" target="_blank">Instagram ↗</a>
            </div>
        </header>

        <div class="title-section">
            <h1 id="main-title">Photography</h1>
            <div class="subtitle" id="main-subtitle">#archive</div>
        </div>

        <main class="gallery-grid">
            <div class="gallery-item">
                <img src="11E6FC36-2562-4612-AE15-3F45127E8CBF.JPG" alt="Photo Archive 1">
            </div>
            <div class="gallery-item">
                <img src="340EDF6B-C513-478E-B3C3-38017D7C36BA.JPG" alt="Photo Archive 2">
            </div>
            <div class="gallery-item">
                <img src="4A688B09-4814-479E-BF40-A092C54BE887.JPG" alt="Photo Archive 3">
            </div>
            <div class="gallery-item">
                <img src="82739FCF-F841-4A18-B5E3-E52CAA0D971E.JPG" alt="Photo Archive 4">
            </div>
            <div class="gallery-item">
                <img src="993DA023-D2E3-460F-AF71-A61516FBE37B.JPG" alt="Photo Archive 5">
            </div>
            <div class="gallery-item">
                <img src="C581C6AE-5B77-4C02-B329-811E24CF0E1F.JPG" alt="Photo Archive 6">
            </div>
            <div class="gallery-item">
                <img src="DA8A5E42-E350-4853-AA3A-66B53A60FE0D.JPG" alt="Photo Archive 7">
            </div>
            <div class="gallery-item">
                <img src="IMG_6623.JPG" alt="Photo Archive 8">
            </div>
        </main>

        <footer>
            <p>© 2026 Tak Hye-won. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
